services:
  web:
    build: .
    container_name: event_ticketing_service
    ports:
      - "5000:5000"
    volumes:
      - ./data:/app/data
    environment:
      - DATABASE_PATH=/app/data/ticketing.db
      - WORKER_POLL_INTERVAL_SECONDS=3.0
      - HOST=0.0.0.0
      - PORT=5000
      - DEBUG=true
    restart: unless-stopped
